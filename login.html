<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); text-align: center; }
        .login-box h2 { color: #1a2a3a; margin-bottom: 30px; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #dce1e8; border-radius: 8px; font-size: 14px; }
        .login-box button { width: 100%; padding: 12px; background: #2d7aff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .login-box button:hover { background: #1a5cc4; }
        .login-box .error-msg { color: #dc3545; margin-bottom: 15px; font-size: 14px; }
        .login-box .success-msg { color: #28a745; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>🔐 تسجيل الدخول</h2>
    <div id="message" class="error-msg"></div>
    <input type="email" id="email" placeholder="البريد الإلكتروني" required>
    <input type="password" id="password" placeholder="كلمة المرور" required>
    <button id="btnLogin">دخول</button>
</div>

<script>
    const SUPABASE_URL = 'https://ycwtrymlqepftuvgqxui.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_mO2nXgZyuQy3Fh1ry_20eg_CMszH3mS';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // قراءة الرابط الحالي (لتغيير كلمة المرور إذا كان المستخدم قد طلب ذلك)
    const urlParams = new URLSearchParams(window.location.search);
    const recoveryCode = urlParams.get('code');
    const isResetPassword = !!recoveryCode;

    if (isResetPassword) {
        // إذا كان المستخدم في وضع استرداد كلمة المرور، اعرض له نموذج تغيير كلمة المرور
        document.querySelector('.login-box').innerHTML = `
            <h2>🔑 تغيير كلمة المرور</h2>
            <div id="message" class="error-msg"></div>
            <input type="password" id="newPassword" placeholder="كلمة المرور الجديدة (6 أحرف على الأقل)" required>
            <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور" required>
            <button id="btnChangePassword">حفظ وتغيير كلمة المرور</button>
        `;

        document.getElementById('btnChangePassword').addEventListener('click', async () => {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const msg = document.getElementById('message');

            if (newPassword.length < 6) {
                msg.textContent = 'يرجى كتابة كلمة مرور (6 أحرف على الأقل).';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                msg.textContent = 'كلمتا المرور غير متطابقتين.';
                return;
            }

            // تحديث كلمة المرور في Supabase Auth
            const { data, error } = await supabase.auth.updateUser({
                password: newPassword
            });

            if (error) {
                msg.textContent = '❌ فشل تحديث كلمة المرور: ' + error.message;
                return;
            }

            alert('✅ تم تحديث كلمة المرور بنجاح!');
            
            // تسجيل الخروج ثم إعادة الدخول
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        });
    } else {
        // إذا كان المستخدم في وضع تسجيل الدخول العادي
        document.getElementById('btnLogin').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');

            if (!email || !password) {
                msg.textContent = 'يرجى ملء الحقول.';
                return;
            }

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    msg.textContent = '❌ فشل تسجيل الدخول: ' + error.message;
                    return;
                }

                // التحقق من وجود المستخدم في جدول staff_profiles (بالبرید الإلكتروني)
                const { data: profile, error: profileError } = await supabase
                    .from('staff_profiles')
                    .select('*')
                    .eq('email', data.user.email)
                    .single();

                // إذا لم يوجد السجل في الجدول، قم بتسجيل الخروج وإرجاع رسالة
                if (profileError || !profile) {
                    await supabase.auth.signOut();
                    msg.textContent = '❌ هذا الحساب غير مسجل في نظام الموظفين.';
                    return;
                }

                // إذا كان موجوداً، انتقل إلى لوحة التحكم
                window.location.href = 'dashboard-admin.html';
            } catch (e) {
                msg.textContent = '❌ حدث خطأ في الاتصال: ' + e.message;
            }
        });
    }
</script>
</body>
</html>
