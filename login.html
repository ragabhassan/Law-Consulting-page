<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ... (أنماط CSS كما هي في الملف الأصلي) ... */
    </style>
</head>
<body>
<!-- ... (هيكل الصفحة كما هو) ... -->
<script>
    (function() {
        'use strict';

        const SUPABASE_URL = 'https://ycwtrymlqepftuvgqxui.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_mO2nXgZyuQy3Fh1ry_20eg_CMszH3mS';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let allConsultations = [];
        let allEmployees = [];
        let currentFilteredData = [];

        async function initPage() {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error || !session) {
                window.location.href = 'login.html';
                return;
            }

            // التحقق من وجود المستخدم في جدول staff_profiles
            const { data: profile, error: profileError } = await supabase
                .from('staff_profiles')
                .select('*')
                .eq('email', session.user.email)
                .single();

            if (profileError || !profile) {
                await supabase.auth.signOut();
                window.location.href = 'login.html';
                return;
            }

            currentUser = {
                id: profile.id,
                role: profile.role,
                full_name: profile.full_name
            };

            document.getElementById('userNameDisplay').textContent = `👤 ${currentUser.full_name}`;

            if (currentUser.role === 'manager') {
                document.getElementById('pageTitle').innerHTML = `🏛️ لوحة تحكم المدير <span class="user-info">👤 ${currentUser.full_name}</span>`;
                document.getElementById('btnShowEmployees').classList.remove('hidden');
                document.getElementById('btnManualEntry').classList.remove('hidden');
                document.getElementById('btnShowConsultations').classList.remove('hidden');
            } else if (currentUser.role === 'secretary') {
                document.getElementById('pageTitle').innerHTML = `📝 لوحة السكرتير <span class="user-info">👤 ${currentUser.full_name}</span>`;
                document.getElementById('btnShowEmployees').classList.add('hidden');
                document.getElementById('btnManualEntry').classList.remove('hidden');
                document.getElementById('btnShowConsultations').classList.remove('hidden');
            } else {
                document.getElementById('pageTitle').innerHTML = `📋 لوحة المتابعة <span class="user-info">👤 ${currentUser.full_name}</span>`;
                document.getElementById('btnShowEmployees').classList.add('hidden');
                document.getElementById('btnManualEntry').classList.add('hidden');
                document.getElementById('btnShowConsultations').classList.remove('hidden');
            }

            document.getElementById('btnShowConsultations').addEventListener('click', () => showSection('sectionConsultations'));
            document.getElementById('btnManualEntry').addEventListener('click', () => showSection('sectionManualEntry'));
            document.getElementById('btnShowEmployees').addEventListener('click', () => showSection('sectionEmployees'));
            document.getElementById('btnLogout').addEventListener('click', handleLogout);

            document.getElementById('btnApplyFilters').addEventListener('click', applyFilters);
            document.getElementById('btnResetFilters').addEventListener('click', function() {
                document.getElementById('filterDateFrom').value = '';
                document.getElementById('filterDateTo').value = '';
                document.getElementById('filterService').value = '';
                applyFilters();
            });

            document.getElementById('btnAddEmployee').addEventListener('click', addEmployee);
            document.getElementById('btnAddManualConsultation').addEventListener('click', addManualConsultation);

            await fetchEmployees();
            await fetchConsultations();

            showSection('sectionConsultations');
        }

        // ... (باقي الدوال كما هي في الملف الأصلي: renderConsultations, renderEmployees, openPreview, etc.)
        // ... (تأكد من إضافة دالة addEmployee التي تستخدم supabase.auth.signUp وتضيف السجل في staff_profiles)

        document.addEventListener('DOMContentLoaded', initPage);
    })();
</script>
</body>
</html>
